[package]
name = "hifi-podcast"
version = "0.1.0"
description = "HIFI podcast — lokal hi-fi podcastspelare"
authors = ["Fagerhierta Consulting"]
edition = "2021"

[lib]
name = "hifi_podcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rss = "2"
opml = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
url = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync", "process"] }
futures-util = "0.3"
id3 = "1"
which = "7"

[target.'cfg(windows)'.dependencies]
souvlaki = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
